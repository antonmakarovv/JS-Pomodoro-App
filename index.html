<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Pomodoro-App/styles.css">
  <title>Pomodoro App</title>
</head>
<body>
  <main class="pomodoro">
    <div class="container">
      <div class="stats-container">
        <div class="stat-card">
          <p class="stat-label">Work Sessions</p>
          <span class="stat-value work-sessions">0</span>
        </div>
        <div class="stat-card">
          <p class="stat-label">Status</p>
          <span class="stat-value status">Ready</span>
        </div>
      </div>
      <button class="work-btn" type="button">Work</button>
      <button class="break-btn" type="button">Break</button>
      <button class="pause-btn" type="button">Pause</button>
      <button class='reset-btn' type="button">Reset</button>
      <span class="display"></span>
    </div>
  </main>
  <script src="Pomodoro-App/script.js"></script>
</body>
</html>
